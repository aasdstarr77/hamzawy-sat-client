<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حمزاوي سات</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:20px}.card{background:#1e293b;padding:20px;border-radius:15px;max-width:400px;margin:auto}button{background:#22c55e;color:#000;padding:12px;width:100%;border:none;border-radius:10px;font-weight:bold;margin-top:10px}select,input,textarea{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}</style>
</head><body><div class="card"><h2>📡 حمزاوي سات</h2>
<select id="service"><option>تركيب دش</option><option>تركيب كاميرات</option><option>صيانة دش</option><option>تركيب شاشات</option></select>
<input id="phone" placeholder="رقم موبايلك"><input id="address" placeholder="العنوان">
<textarea id="details" placeholder="تفاصيل"></textarea>
<button onclick="send()">اطلب الآن</button><p id="msg"></p></div>
<script>
const API_URL = 'https://hamzawy-sat-123.loca.lt';
async function send(){
 const data={service:document.getElementById('service').value, phone:document.getElementById('phone').value, address:document.getElementById('address').value, details:document.getElementById('details').value};
 if(!data.phone||!data.address){document.getElementById('msg').innerText='اكتب الموبايل والعنوان';return}
 document.getElementById('msg').innerText='جاري الإرسال...';
 try{ await fetch(API_URL+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Bypass-Tunnel-Reminder':'true'},body:JSON.stringify(data)}); }catch(e){}
 const text=`طلب جديد - حمزاوي سات%0Aالخدمة: ${data.service}%0Aموبايل: ${data.phone}%0Aالعنوان: ${data.address}%0Aتفاصيل: ${data.details}`;
 window.open(`https://wa.me/201000000000?text=${text}`,'_blank');
 document.getElementById('msg').innerText='✅ تم إرسال الطلب - هيظهر في صفحة الأدمن';
}
</script></body></html>
